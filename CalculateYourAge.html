<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Da'daada ku xisaabo</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f5f7;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 250px;
    margin: 10px auto;
    padding: 10px;
    background: white;
    border-radius: 4px;
    box-shadow: 0 2px 10px #ccc;
}

h2 {
    text-align: center;
    color: #234f68;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #aaa;
    border-radius: 5px;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 22px;
    font-size: 16px;
    background: #2878a5;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #1b587b;
}

#result {
    margin-top: 20px;
    padding: 15px;
    background: #eaf4f8;
    border-radius: 5px;
    text-align: center;
    line-height: 1.8;
    font-size: 17px;
}
</style>
</head>

<body>

<div class="container">

    <h2>Da'daada ku xisaabo</h2>

    <label for="year">Qor Sanadka</label>
    <input type="number" id="year"
           placeholder=""
           min="1" step="1">

    <label for="month">Bisha</label>
    <input type="number" id="month"
           placeholder=""
           min="1" max="12" step="1">

    <label for="day">Maalinta</label>
    <input type="number" id="day"
           placeholder=""
           min="1" max="31" step="1">

    <button type="button" onclick="calculateAge()">
        Riix natiijada
    </button>

    <div id="result" aria-live="polite">
       Da'daadu halkan bay ka soo bixi
    </div>

</div>

<script>
function calculateAge() {
    const year = Number(document.getElementById("year").value);
    const month = Number(document.getElementById("month").value);
    const day = Number(document.getElementById("day").value);
    const result = document.getElementById("result");

    if (
        !Number.isInteger(year) ||
        !Number.isInteger(month) ||
        !Number.isInteger(day) ||
        year < 1 ||
        month < 1 || month > 12 ||
        day < 1 || day > 31
    ) {
        result.textContent =
            "Fadlan geli Sanad, Bil & Maalin sax ah";
        return;
    }

    const birth = new Date(0);
    birth.setFullYear(year, month - 1, day);
    birth.setHours(0, 0, 0, 0);

    if (
        birth.getFullYear() !== year ||
        birth.getMonth() !== month - 1 ||
        birth.getDate() !== day
    ) {
        result.textContent =
            "That date does not exist. Please check your birthday.";
        return;
    }

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    if (birth > today) {
        result.textContent =
            "Your birth date cannot be in the future.";
        return;
    }

    let years = today.getFullYear() - year;
    let months = today.getMonth() - (month - 1);
    let days = today.getDate() - day;

    if (days < 0) {
        months--;

        const previousMonth = new Date(
            today.getFullYear(),
            today.getMonth(),
            0
        );

        days += previousMonth.getDate();
    }

    if (months < 0) {
        years--;
        months += 12;
    }

    result.innerHTML =
        "You are <strong>" + years + "</strong> years,<br>" +
        "<strong>" + months + "</strong> months and<br>" +
        "<strong>" + days + "</strong> days old.";
}
</script>

</body>
</html>
